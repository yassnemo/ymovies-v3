version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development:
        dependency-type: development
      runtime:
        dependency-type: production
  - package-ecosystem: pip
    directory: /recommendation_service
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      service:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
