name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        adapter: [node, vercel]
    env:
      VERCEL: ${{ matrix.adapter == 'vercel' && '1' || '' }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Check TypeScript
      run: npm run check
    
    - name: Test application
      run: npm test

    - name: Build SvelteKit (${{ matrix.adapter }})
      run: npm run build
